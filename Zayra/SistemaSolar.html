<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Solar: Guía de Turismo Cósmico</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Sistema Solar: Guía de Turismo Cósmico</h1>
        <p>Tu próxima aventura fuera de este mundo comienza aquí.</p>
    </header>

    <main>
        <section id="mapa-sistema-solar">
            <h2>Mapa Interactivo</h2>
            <div class="contenedor-planetas">
                <div class="planeta" data-planeta="Mercurio">
                    <img src="img/Mercurio.jpg.jpg" alt="Mercurio">
                    <span>Mercurio</span>
                </div>
                <div class="planeta" data-planeta="Venus">
                    <img src="img/Venus.jpg.jpg" alt="Venus">
                    <span>Venus</span>
                </div>
                <div class="planeta" data-planeta="Tierra">
                    <img src="img/Tierra.jpg.jpg" alt="Tierra">
                    <span>Tierra</span>
                </div>
                <div class="planeta" data-planeta="Marte">
                    <img src="img/Marte.jpg.jpg" alt="Marte">
                    <span>Marte</span>
                </div>
                <div class="planeta" data-planeta="Júpiter">
                    <img src="img/Jupiter.jpg.jpg" alt="Júpiter">
                    <span>Júpiter</span>
                </div>
                <div class="planeta" data-planeta="Saturno">
                    <img src="img/Saturno.jpg.jpg" alt="Saturno">
                    <span>Saturno</span>
                </div>
                <div class="planeta" data-planeta="Urano">
                    <img src="img/Urano.jpg.jpg" alt="Urano">
                    <span>Urano</span>
                </div>
                <div class="planeta" data-planeta="Neptuno">
                    <img src="img/Neptuno.jpg.jpg" alt="Neptuno">
                    <span>Neptuno</span>
                </div>
            </div>
        </section>

        <section id="detalle-planeta" class="oculto">
            <h2 id="nombre-planeta">Selecciona un destino</h2>
            <div id="info-planeta">
                <p><strong>Gravedad:</strong> <span id="gravedad"></span></p>
                <p><strong>Temperatura:</strong> <span id="temperatura"></span></p>
                <p><strong>Guía de viaje:</strong> <span id="guia"></span></p>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
